name: Daily city check

# Runs every morning, fully automatically: checks the City of Boise for changes, updates the report (new projects,
# statuses, deadlines, drawings, notice areas), saves the day's results to the repository and publishes the page
# to GitHub Pages. Nobody needs to review anything.
# Also runs on every push to main (rebuild only; include "[check city]" in the commit message to run the full
# city check) and on demand from the Actions tab (Run workflow).

on:
  schedule:
    - cron: "55 12 * * *"      # 12:55 UTC = 5:55 am Mountain Standard Time (6:55 am in summer)
    - cron: "17 14-23 * * *"   # hourly backups through the afternoon; each stops at once if today's check already ran
    # GitHub starts scheduled runs on a best-effort basis and can delay them by hours, hence the backups.
  workflow_dispatch:
    inputs:
      check_city:
        description: "Check the City of Boise for changes (unchecked: just rebuild the page)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write   # save the day's results back to the repository
  pages: write      # publish to GitHub Pages
  id-token: write

env:
  # Dates (today's check, deadlines, the change log) follow Boise time, not the runner's UTC clock
  TZ: America/Boise
  # Black out phone numbers and emails on drawings ("false" to show them as filed with the city)
  SBV_REDACT_CONTACTS: "true"

concurrency:
  group: sbv-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.today.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Has today's check already run?
        id: today
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/changes/$(date +%F).txt" ]; then
            echo "Today's check already ran; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.today.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        if: steps.today.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr > /dev/null

      - name: Check the city and rebuild the page
        id: city
        if: >-
          (github.event_name == 'schedule' && steps.today.outputs.skip != 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.check_city) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[check city]'))
        run: python update.py --public

      - name: Rebuild the page only
        if: steps.city.conclusion == 'skipped' && steps.today.outputs.skip != 'true'
        run: python update.py --build --public

      - name: Save the day's results to the repository
        if: steps.city.conclusion == 'success'
        run: python ci_tools.py commit

      - name: Add the other pages (pages/ folder, e.g. pages/west-bench → /west-bench/)
        if: steps.today.outputs.skip != 'true'
        run: mkdir -p public && cp -r pages/. public/

      - uses: actions/configure-pages@v5
        if: steps.today.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.today.outputs.skip != 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
